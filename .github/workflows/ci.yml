# 09-test-plan.md §4. Every job must pass before merge.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI is up to date with the zod schemas
        run: pnpm openapi && git diff --exit-code packages/core/openapi.json
      - name: Next.js build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: No key-like strings in the client bundle (08 §1.5)
        # A base58 key stands alone; runs inside base64 blobs (fonts) and pure hex (curve constants) are not keys.
        run: |
          B58='[1-9A-HJ-NP-Za-km-z]{87,88}'
          hits=$(grep -rEoI "(pm_test_[A-Za-z0-9_-]{8,}|sk-[A-Za-z0-9]{20,}|(^|[^A-Za-z0-9+/=_-])${B58}([^A-Za-z0-9+/=_-]|$))" apps/web/.next/static \
            | grep -vE ':[^A-Za-z0-9]?x?[0-9a-fA-F]+[^A-Za-z0-9]?$' || true)
          if [ -n "$hits" ]; then
            echo "$hits"; echo "secret-looking string found in client bundle"; exit 1
          fi

  program:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Solana (Agave) CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI 1.2.0
        run: |
          cargo install --git https://github.com/solana-foundation/anchor avm --force
          avm install 1.2.0 && avm use 1.2.0
      - run: anchor build
      - run: cargo test -p proofmarket
      - name: Committed IDL matches the build
        run: diff <(jq -S . target/idl/proofmarket.json) <(jq -S . packages/solana/idl/proofmarket.json)

  secrets:
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API; contents:read alone returns 403.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
