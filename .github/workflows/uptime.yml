# Backup outside check of production (12 §5.5, 08 §5): GET /v1/health/ready. It answers 200 when the database
# responds and the job queue keeps up, 503 otherwise. A failed run makes GitHub email the owner.
# The schedule says every 5 minutes, but GitHub thins scheduled runs out: in practice it ran every 4–7 hours, and
# the 2026-11-06..08 outage went almost two days with only emails. The primary monitor is Better Stack (3-minute
# checks, push to the owner's phone), set up with scripts/betterstack-monitors.ts. This workflow stays as a second
# opinion that needs no outside account.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /v1/health/ready
        run: |
          body=$(curl -sS --max-time 20 -w '\n%{http_code}' https://proofmarket.fun/v1/health/ready) || { echo "unreachable"; exit 1; }
          code=${body##*$'\n'}
          echo "$code ${body%$'\n'*}"
          [ "$code" = "200" ]
