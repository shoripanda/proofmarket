# Backup outside check of production (12 §5.5, 08 §5): GET /v1/health/ready. It answers 200 when the database
# responds and the tick keeps up, 503 otherwise. A failed run makes GitHub email the owner.
# The schedule asks for every 5 minutes, but GitHub throttles it: in November 2026 it ran every 4-7 hours, and the
# 2026-11-06 outage went unnoticed for almost two days. The primary monitor is an outside uptime service with phone
# alerts (docs/ops/uptime-monitor.md); this job only backs it up.
name: uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /v1/health/ready
        run: |
          body=$(curl -sS --max-time 20 -w '\n%{http_code}' https://proofmarket.fun/v1/health/ready) || { echo "unreachable"; exit 1; }
          code=${body##*$'\n'}
          echo "$code ${body%$'\n'*}"
          [ "$code" = "200" ]
