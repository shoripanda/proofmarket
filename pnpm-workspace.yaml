packages:
  - apps/*
  - packages/*
  - scripts

# Dependencies allowed to run install scripts (pnpm blocks them by default).
allowBuilds:
  esbuild: true
  sharp: true
  # Optional native accelerators / postinstall hooks with pure-JS fallbacks: keep disabled.
  bigint-buffer: false
  utf-8-validate: false
  bufferutil: false
  keccak: false
  "@reown/appkit": false

# Security: lift ws 8.x copies pinned by wallet/viem dependencies to the patched release (GHSA ws memory DoS).
# Only within major 8; ws 7 copies are left as they are.
overrides:
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
