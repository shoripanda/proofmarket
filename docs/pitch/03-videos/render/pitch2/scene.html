<!doctype html>
<html lang="en">

<style>

  .browser .bar i:nth-child(1) { background: #ff5f57; } .browser .bar i:nth-child(2) { background: #febc2e; } .browser .bar i:nth-child(3) { background: #28c840; }
  .browser img { display: block; width: 100%; }
  .bubble { max-width: 760px; padding: 26px 36px; border-radius: 34px; font-size: 40px; font-weight: 500; line-height: 1.25; }
  .me { background: #0a84ff; color: #fff; border-bottom-right-radius: 10px; align-self: flex-end; }
  .bot { background: #e9e9eb; color: #1d1d1f; border-bottom-left-radius: 10px; align-self: flex-start; }

  .ok .mark { background: #e6f6ef; color: #0f6e4b; } .bad .mark { background: #fdeaea; color: #c0262c; }

  .stat span { display: block; margin-top: 18px; font-size: 34px; color: #6e6e73; font-weight: 500; }
  .strike { position: relative; display: inline-block; }
  .strike::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: 8px; background: #c0262c; border-radius: 4px; transform: scaleX(var(--s, 0)); transform-origin: left; }
  .tx { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 32px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .row span:first-child { color: #a1a1a6; font-weight: 500; } .row span:last-child { font-weight: 600; }

<body>
<script>
const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
const anims = []; const seekers = [];
function el(tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; return e; }
// Animate with absolute times (seconds). Keyframes get fill:both and the animation is paused for seeking.
function tween(node, keyframes, at, dur, easing = EASE, fill = "both") {
  const a = node.animate(keyframes, { delay: at * 1000, duration: Math.max(dur, 0.001) * 1000, fill, easing });
  a.pause(); anims.push(a); return a;
}
// Enter at `at`, stay, leave at `out` (if given).
function show(node, at, { from = "translateY(40px)", dur = 0.8, out, outDur = 0.5, outTo = "translateY(-30px)", scale } = {}) {
  node.style.opacity = "0";
  tween(node, [{ opacity: 0, transform: from }, { opacity: 1, transform: scale ? `scale(${scale})` : "none" }], at, dur);
  if (out != null) tween(node, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: outTo }], out, outDur, "ease-in", "forwards");
}
function scene(cls, s, fadeIn = 0.45, fadeOut = 0.45) {
  const d = el("div", `scene ${cls}`);
  document.body.append(d);
  tween(d, [{ opacity: 0 }, { opacity: 1 }], s.start, fadeIn, "ease-out");
  if (fadeOut > 0) tween(d, [{ opacity: 1 }, { opacity: 0 }], s.next - fadeOut, fadeOut, "ease-in", "forwards");
  d.style.zIndex = String(10 + Math.round(s.start)); // later scenes on top during crossfade
  return d;
}
function phone(parent, frames, x, y, swaps) {
  // frames: [[src, atSeconds], ...] crossfaded by seek
  const p = el("div", "phone", "", `left:${x}px; top:${y}px`);
  const imgs = frames.map(([src]) => { const i = el("img"); i.src = src; i.style.opacity = "0"; p.append(i); return i; });
  parent.append(p);
  seekers.push((t) => {
    for (let k = 0; k < frames.length; k++) {
      const at = frames[k][1]; const nextAt = frames[k + 1]?.[1] ?? Infinity;
      let o = 0;
      if (t >= at && t < nextAt) o = Math.min(1, (t - at) / 0.35);
      else if (t >= nextAt && t < nextAt + 0.35) o = 1 - (t - nextAt) / 0.35;
      if (k === frames.length - 1 && t >= at) o = Math.min(1, (t - at) / 0.35);
      imgs[k].style.opacity = String(Math.max(0, o));
    }
  });
  return p;
}
function browser(parent, src, x, y, w, h, style = "") {
  const b = el("div", "browser", `<div class="bar"><i></i><i></i><i></i></div>`, `left:${x}px; top:${y}px; width:${w}px; height:${h}px; ${style}`);
  const i = el("img"); i.src = src; b.append(i); parent.append(b); return b;
}
function counter(node, from, to, at, dur, fmt = (v) => String(v)) {
  seekers.push((t) => { const k = Math.max(0, Math.min(1, (t - at) / dur)); const e = 1 - (1 - k) ** 3; node.textContent = fmt(Math.round(from + (to - from) * e)); });
}

    d.append(list);
    const lead = el("div", "sub", "But it can't", "font-size:44px"); list.append(lead); show(lead, s.voice + 3.0);
    [["walk to a shop", 3.4], ["read a paper notice", 4.4], ["make a call", 5.5]].forEach(([txt, at]) => {

      show(line, s.voice + at, { from: "translateY(30px)" });

      seekers.push((t) => { const k = Math.max(0, Math.min(1, (t - (s.voice + at + 0.55)) / 0.4)); st.style.setProperty("--s", String(k)); });
    });
  }
  // 1 — chat, then shutters
  { const s = S[1]; const d = scene("light", s);

    d.append(chat);
    const q = el("div", "bubble me", "Is this café open tonight?"); chat.append(q); show(q, s.voice + 0.4, { from: "translateY(30px) scale(.96)" });
    const a = el("div", "bubble bot", "Yes — open until 20:00."); chat.append(a); show(a, s.voice + 2.2, { from: "translateY(30px) scale(.96)" });
    const cap = el("div", "caption", "Source: a web listing · last updated 3 weeks ago", "align-self:flex-start; margin-left:36px"); chat.append(cap); show(cap, s.voice + 3.4);
    const dark = el("div", "abs", "", "inset:0; background:#0b0f14; opacity:0"); d.append(dark);
    tween(dark, [{ opacity: 0 }, { opacity: 1 }], s.voice + 5.2, 0.8, "ease-in-out");
    const h = el("div", "h1", "The shutters are down.", "position:absolute; left:0; right:0; top:470px; text-align:center; color:#f5f5f7");

    [["Is it the right place?", 3.6], ["Was it taken just now?", 4.3], ["Does the answer match the request?", 5.0]].forEach(([t, at]) => {

    });
    const h2 = el("div", "h2", "The agent can't tell.", "position:absolute; left:140px; top:760px; color:#c0262c"); d.append(h2); show(h2, s.voice + 5.6);
  }
  // 3 — brand

    const tg = el("div", "sub", "Ask a person. Get proof on Solana.", "margin-top:26px; font-size:46px; color:#fff; font-weight:600"); c.append(tg); show(tg, s.voice + 1.5);
    const note = el("div", "small", "Narration: synthesized voice reading the founder's script", "left:0; right:0; bottom:40px; text-align:center"); d.append(note); show(note, s.start + 0.8, { from: "none" });
  }
  // 4 — one request, escrowed (real agent card)
  { const s = S[4]; const d = scene("light", s);
    const h = el("div", "h2", "One request.<br>Escrowed on Solana.", "position:absolute; left:140px; top:200px; width:820px"); d.append(h); show(h, s.voice + 0.2);
    const pills = el("div", "", "", "position:absolute; left:140px; top:470px; display:flex; gap:18px"); d.append(pills);
    ["MCP", "REST", "x402"].forEach((t, i) => { const p = el("div", "pill teal-p", t); pills.append(p); show(p, s.voice + 2.6 + i * 0.25, { from: "translateY(20px)" }); });

    const card = el("div", "card", "", "position:absolute; left:1040px; top:90px; width:720px; height:812px; overflow:hidden; border-radius:30px");

  { const s = S[6]; const d = scene("light", s);

    [["Taken at the requested place", 0.9], ["Taken just now", 1.5], ["Not a reused photo", 2.1]].forEach(([t, at]) => {
      const c = el("div", "check ok", `<span class="mark">✓</span>${t}`); list.append(c); show(c, s.voice + at, { from: "translateX(-30px)" });
    });
    const rv = el("div", "card", "", "position:absolute; left:140px; top:560px; width:860px; padding:30px 34px; display:flex; flex-direction:column; gap:14px");
    rv.innerHTML = `<div style="font-size:26px; color:#6e6e73; font-weight:600">Claude review</div>
      <div style="font-size:32px; font-weight:600; line-height:1.3">The answer is a summary, but the request asks for the exact text.</div>
      <div class="pill red-p" style="align-self:flex-start; font-size:28px; padding:12px 24px">Sent back · 2 attempts left</div>`;
    d.append(rv); show(rv, s.voice + 3.6, { from: "translateY(40px)" });
    const ok = el("div", "pill green-p", "<span class=\"dot\"></span>Attempt 2 · matches the request", "position:absolute; left:140px; top:860px; font-size:30px"); d.append(ok); show(ok, s.voice + 7.0, { from: "translateY(20px)" });
    phone(d, [[A + "phone-22.png", s.start], [A + "phone-14.png", s.voice + 3.6], [A + "phone-18.png", s.voice + 6.0], [A + "phone-22.png", s.voice + 7.0]], 1240, 160);
    const ph = d.querySelector(".phone"); show(ph, s.start + 0.1, { from: "translateY(80px)", dur: 1.0 });
  }
  // 7 — one transaction
  { const s = S[7]; const d = scene("navy", s);
    const h = el("div", "h2", "One transaction.<br>Proof anyone can re-read.", "position:absolute; left:140px; top:120px; width:900px"); d.append(h); show(h, s.voice + 0.1);
    const tx = el("div", "", "", "position:absolute; left:140px; top:400px; width:820px; padding:10px 0"); d.append(tx);
    [["Program", "ProofMarket escrow · Solana"], ["Result hash", "<span class=tx>7f3a 9c21 … e4b0</span>"], ["Evidence root", "<span class=tx>c0de 51aa … 18f7</span>"], ["Payout", "0.30 USDC → worker"], ["Witnesses", "1 of 1 agreed"]].forEach(([k, v], i) => {
      const r = el("div", "row", `<span>${k}</span><span>${v}</span>`); tx.append(r); show(r, s.voice + 0.8 + i * 0.35, { from: "translateX(-20px)" });
    });
    const conf = el("div", "pill green-p", "<span class=\"dot\"></span>Confirmed · recorded and paid", "position:absolute; left:140px; top:800px; font-size:30px"); d.append(conf); show(conf, s.voice + 3.2, { from: "translateY(20px)" });
    phone(d, [[A + "phone-29.png", s.start]], 1340, 160);
    const ph = d.querySelector(".phone"); show(ph, s.voice + 2.6, { from: "translateY(80px)", dur: 1.0, out: s.voice + 6.1, outTo: "translateX(80px)" });
    const card = el("div", "card", "", "position:absolute; left:1040px; top:120px; width:720px; height:840px; overflow:hidden; border-radius:30px");
    const img = el("img", "", "", "width:720px; display:block"); img.src = A + "agent-result.png"; card.append(img); d.append(card);
    show(card, s.voice + 6.8, { from: "translateY(60px)", dur: 0.9 });
    const lbl = el("div", "pill", "Structured JSON + public proof page", "position:absolute; left:1070px; top:880px; font-size:28px"); d.append(lbl); show(lbl, s.voice + 7.6, { from: "translateY(20px)" });
  }
  // 8 — why Solana
  { const s = S[8]; const d = scene("white", s);
    const h = el("div", "h2", "Why Solana", "position:absolute; left:0; right:0; top:130px; text-align:center"); d.append(h); show(h, s.voice + 0.1);

  { const s = S[10]; const d = scene("white", s);
    const n = el("div", "h2", "Hiroki Hashimoto", "position:absolute; left:140px; top:200px"); d.append(n); show(n, s.voice + 0.2);
    const r = el("div", "sub", "Solo founder · Japan · builds with AI tools", "position:absolute; left:140px; top:310px"); d.append(r); show(r, s.voice + 1.0);
