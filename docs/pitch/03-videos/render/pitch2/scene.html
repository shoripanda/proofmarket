<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #f5f5f7; }
  body { font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Inter, Arial, sans-serif; color: #1d1d1f;
         -webkit-font-smoothing: antialiased; letter-spacing: -0.02em; }
  .scene { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
  .light { background: #f5f5f7; } .white { background: #fff; } .dark { background: #0b0f14; color: #f5f5f7; }
  .teal { background: radial-gradient(1200px 800px at 30% 20%, #14897f 0%, #0f766e 45%, #0b4f4a 100%); color: #fff; }
  .navy { background: radial-gradient(1400px 900px at 70% 80%, #16213a 0%, #0b1220 60%, #070b14 100%); color: #f5f5f7; }
  .h1 { font-weight: 700; font-size: 96px; line-height: 1.08; }
  .h2 { font-weight: 700; font-size: 72px; line-height: 1.1; }
  .sub { font-weight: 500; font-size: 36px; line-height: 1.35; color: #6e6e73; }
  .dark .sub, .navy .sub { color: #a1a1a6; } .teal .sub { color: rgba(255,255,255,.82); }
  .abs { position: absolute; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .pill { display: inline-flex; align-items: center; gap: 14px; padding: 16px 30px; border-radius: 999px; font-weight: 600; font-size: 32px;
          background: #fff; color: #1d1d1f; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .pill.teal-p { background: #0f766e; color: #fff; }
  .pill.red-p { background: #fdeaea; color: #c0262c; } .pill.green-p { background: #e6f6ef; color: #0f6e4b; }
  .pill.grey-p { background: #e9e9eb; color: #6e6e73; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; opacity: .7; }
  .card { background: #fff; border-radius: 28px; box-shadow: 0 30px 80px rgba(0,0,0,.12); }
  .phone { position: absolute; width: 440px; height: 762px; }
  .phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border-radius: 40px; }
  .phone::after { content: ""; position: absolute; inset: 0; border-radius: 40px; box-shadow: 0 50px 100px rgba(0,0,0,.28); pointer-events: none; z-index: -1; }
  .browser { position: absolute; background: #fff; border-radius: 22px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,.22); }
  .browser .bar { height: 46px; background: #ececef; display: flex; align-items: center; gap: 10px; padding-left: 20px; }
  .browser .bar i { width: 14px; height: 14px; border-radius: 50%; display: block; background: #d1d1d6; }
  .browser .bar i:nth-child(1) { background: #ff5f57; } .browser .bar i:nth-child(2) { background: #febc2e; } .browser .bar i:nth-child(3) { background: #28c840; }
  .browser img { display: block; width: 100%; }
  .caption { font-size: 26px; color: #8e8e93; font-weight: 500; }
  .check { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 600; }
  .check .mark { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; font-weight: 800; }
  .ok .mark { background: #e6f6ef; color: #0f6e4b; } .bad .mark { background: #fdeaea; color: #c0262c; }
  .stat { text-align: center; } .stat b { display: block; font-size: 150px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: #0f766e; }
  .stat span { display: block; margin-top: 18px; font-size: 34px; color: #6e6e73; font-weight: 500; }
  .strike { position: relative; display: inline-block; }
  .strike::after { content: ""; position: absolute; left: -2%; right: -2%; top: 52%; height: 8px; background: #c0262c; border-radius: 4px; transform: scaleX(var(--s, 0)); transform-origin: left; }
  .tx { font-family: ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 0; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 32px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.08); }
  .row span:first-child { color: #a1a1a6; font-weight: 500; } .row span:last-child { font-weight: 600; }
  .small { position: absolute; font-size: 22px; color: rgba(255,255,255,.6); font-weight: 500; letter-spacing: 0; }
  .light .small, .white .small { color: #8e8e93; }
  .term { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .term b { font-size: 64px; font-weight: 800; color: #0f766e; letter-spacing: -0.03em; line-height: 1; }
  .term span { font-size: 26px; color: #6e6e73; font-weight: 600; }
  .op { font-size: 72px; font-weight: 300; color: #a1a1a6; align-self: flex-start; margin-top: 2px; }
</style>
</head>
<body>
<script>
const EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
const anims = []; const seekers = [];
function el(tag, cls, html, style) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (style) e.style.cssText = style; return e; }
// Animate with absolute times (seconds). Keyframes get fill:both and the animation is paused for seeking.
function tween(node, keyframes, at, dur, easing = EASE, fill = "both") {
  const a = node.animate(keyframes, { delay: at * 1000, duration: Math.max(dur, 0.001) * 1000, fill, easing });
  a.pause(); anims.push(a); return a;
}
// Enter at `at`, stay, leave at `out` (if given).
function show(node, at, { from = "translateY(40px)", dur = 0.8, out, outDur = 0.5, outTo = "translateY(-30px)", scale } = {}) {
  node.style.opacity = "0";
  tween(node, [{ opacity: 0, transform: from }, { opacity: 1, transform: scale ? `scale(${scale})` : "none" }], at, dur);
  if (out != null) tween(node, [{ opacity: 1, transform: "none" }, { opacity: 0, transform: outTo }], out, outDur, "ease-in", "forwards");
}
function scene(cls, s, fadeIn = 0.45, fadeOut = 0.45) {
  const d = el("div", `scene ${cls}`);
  document.body.append(d);
  tween(d, [{ opacity: 0 }, { opacity: 1 }], s.start, fadeIn, "ease-out");
  if (fadeOut > 0) tween(d, [{ opacity: 1 }, { opacity: 0 }], s.next - fadeOut, fadeOut, "ease-in", "forwards");
  d.style.zIndex = String(10 + Math.round(s.start)); // later scenes on top during crossfade
  return d;
}
function phone(parent, frames, x, y) {
  // frames: [[src, atSeconds], ...] crossfaded by seek
  const p = el("div", "phone", "", `left:${x}px; top:${y}px`);
  const imgs = frames.map(([src]) => { const i = el("img"); i.src = src; i.style.opacity = "0"; p.append(i); return i; });
  parent.append(p);
  seekers.push((t) => {
    for (let k = 0; k < frames.length; k++) {
      const at = frames[k][1]; const nextAt = frames[k + 1]?.[1] ?? Infinity;
      let o = 0;
      if (t >= at && t < nextAt) o = Math.min(1, (t - at) / 0.35);
      else if (t >= nextAt && t < nextAt + 0.35) o = 1 - (t - nextAt) / 0.35;
      if (k === frames.length - 1 && t >= at) o = Math.min(1, (t - at) / 0.35);
      imgs[k].style.opacity = String(Math.max(0, o));
    }
  });
  return p;
}
function browser(parent, src, x, y, w, h, style = "") {
  const b = el("div", "browser", `<div class="bar"><i></i><i></i><i></i></div>`, `left:${x}px; top:${y}px; width:${w}px; height:${h}px; ${style}`);
  const i = el("img"); i.src = src; b.append(i); parent.append(b); return b;
}
function counter(node, from, to, at, dur, fmt = (v) => String(v)) {
  seekers.push((t) => { const k = Math.max(0, Math.min(1, (t - at) / dur)); const e = 1 - (1 - k) ** 3; node.textContent = fmt(Math.round(from + (to - from) * e)); });
}
function card2(title, color, rows, style) {
  const c = el("div", "card", "", `width:700px; padding:40px 44px; display:flex; flex-direction:column; gap:22px; ${style}`);
  c.innerHTML = `<div style="font-size:30px; color:${color}; font-weight:700; letter-spacing:0">${title}</div>` +
    rows.map(([ok, t]) => `<div class="check ${ok ? "ok" : "bad"}" style="font-size:34px"><span class="mark">${ok ? "✓" : "✕"}</span><span>${t}</span></div>`).join("");
  return c;
}

// One scene per narration line (narration.txt). 2026-10-12: product first, the Colosseum form's questions
// (what and for whom, why now, chains, business model) each get a scene; no founder scene.
window.setup = (tl) => {
  const S = tl.scenes; const A = "assets/";

  // 0 — a million pages before breakfast
  { const s = S[0]; const d = scene("light", s);
    const h = el("div", "h1", "An AI agent can read", "position:absolute; left:140px; top:170px; width:900px"); d.append(h); show(h, s.voice);
    const st = el("div", "stat", `<b style="font-size:190px">0</b><span>pages, before breakfast</span>`, "position:absolute; left:140px; top:360px; text-align:left");
    st.querySelector("span").style.textAlign = "left"; d.append(st); show(st, s.voice + 0.9, { from: "translateY(30px)" });
    counter(st.querySelector("b"), 0, 1000000, s.voice + 0.9, 2.2, (v) => v.toLocaleString("en-US"));
    const pills = el("div", "", "", "position:absolute; left:140px; top:760px; display:flex; gap:18px"); d.append(pills);
    ["Compare", "Edit", "Build", "A finished plan"].forEach((t, i) => { const p = el("div", "pill" + (i === 3 ? " teal-p" : ""), t); pills.append(p); show(p, s.voice + 2.4 + i * 0.25, { from: "translateY(20px)" }); });
    const stack = el("div", "abs", "", "left:1180px; top:200px; width:600px; height:700px"); d.append(stack);
    for (let k = 0; k < 9; k++) {
      const pg = el("div", "card", "", `position:absolute; left:${k * 22}px; top:${k * 26}px; width:420px; height:560px; border-radius:18px; padding:34px; box-sizing:border-box; opacity:0`);
      pg.innerHTML = Array.from({ length: 11 }, (_, j) => `<div style="height:14px; border-radius:7px; background:#e5e5ea; margin-bottom:22px; width:${60 + ((j * 37 + k * 11) % 40)}%"></div>`).join("");
      stack.append(pg); show(pg, s.voice + 0.6 + k * 0.12, { from: "translateY(60px) rotate(-4deg)", dur: 0.7 });
    }
  }
  // 1 — no body: the shutter photo
  { const s = S[1]; const d = scene("dark", s);
    const h = el("div", "h1", "But it has no body.", "position:absolute; left:140px; top:150px; width:900px"); d.append(h); show(h, s.start + 0.15);
    const list = el("div", "", "", "position:absolute; left:140px; top:380px; display:flex; flex-direction:column; gap:30px"); d.append(list);
    [["stand in front of the shop", 2.0], ["and look", 3.2]].forEach(([txt, at]) => {
      const line = el("div", "h2", `<span class="strike">${txt}</span>`, "font-size:64px"); list.append(line); show(line, s.voice + at, { from: "translateY(30px)" });
      const st = line.firstChild; seekers.push((t) => { const k = Math.max(0, Math.min(1, (t - (s.voice + at + 0.5)) / 0.4)); st.style.setProperty("--s", String(k)); });
    });
    const ph = el("div", "card", "", "position:absolute; left:1060px; top:120px; width:720px; height:840px; overflow:hidden; border-radius:30px; background:#111");
    const img = el("img", "", "", "position:absolute; left:-120px; top:0; width:960px; height:840px; object-fit:cover"); img.src = A + "shutter.jpg"; ph.append(img);
    const cap = el("div", "", "A real shop front. The agent will never see it.", "position:absolute; left:0; right:0; bottom:0; padding:22px 30px; font-size:26px; font-weight:600; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.75))"); ph.append(cap);
    d.append(ph); show(ph, s.voice + 1.2, { from: "translateY(60px) scale(.97)", dur: 1.0 });
    tween(img, [{ transform: "scale(1)" }, { transform: "scale(1.08)" }], s.voice + 1.2, 6.0, "linear");
    const credit = el("div", "small", "Photo: Rumi Yoshizawa, CC BY 2.0", "left:1070px; bottom:40px"); d.append(credit); show(credit, s.voice + 2.0, { from: "none" });
  }
  // 2 — the pairing
  { const s = S[2]; const d = scene("light", s);
    const h = el("div", "h2", "ProofMarket pairs the two.", "position:absolute; left:0; right:0; top:110px; text-align:center"); d.append(h); show(h, s.voice + 0.1);
    const a = card2("AI agent", "#0f766e", [[true, "Thinks at scale"], [true, "Asks the right question"]], "position:absolute; left:40px; top:300px; width:600px; box-sizing:border-box");
    const p = card2("A person", "#c2410c", [[true, "Goes there"], [true, "Sees, and confirms"]], "position:absolute; left:1280px; top:300px; width:600px; box-sizing:border-box");
    d.append(a, p); show(a, s.start + 0.2, { from: "translateX(-40px)" }); show(p, s.start + 0.2, { from: "translateX(40px)" });
    tween(a, [{ transform: "translateX(0)" }, { transform: "translateX(260px)" }], s.voice + 1.4, 1.4);
    tween(p, [{ transform: "translateX(0)" }, { transform: "translateX(-260px)" }], s.voice + 1.4, 1.4);
    const plus = el("div", "h1", "+", "position:absolute; left:0; right:0; top:360px; text-align:center; color:#0f766e; font-size:120px"); d.append(plus); show(plus, s.voice + 2.2, { from: "scale(.5)" });
    const sub = el("div", "sub", "The agent thinks at scale. A person goes, sees, and confirms.", "position:absolute; left:0; right:0; top:700px; text-align:center; font-size:40px"); d.append(sub); show(sub, s.voice + 2.6);
    const pw = el("div", "", "", "position:absolute; left:0; right:0; top:830px; display:flex; justify-content:center"); d.append(pw);
    const pill = el("div", "pill teal-p", "Hands, eyes and senses for AI agents", "font-size:34px"); pw.append(pill);
    show(pill, s.voice + 5.2, { from: "translateY(20px)" });
  }
  // 3 — brand
  { const s = S[3]; const d = scene("teal", s, 0.6);
    const c = el("div", "center"); d.append(c);
    const logo = el("img", "", "", "width:180px; height:180px; border-radius:40px; box-shadow:0 30px 80px rgba(0,0,0,.3)"); logo.src = A + "logo.png";
    c.append(logo); show(logo, s.start + 0.1, { from: "scale(.6)", dur: 1.0 });
    const n = el("div", "h1", "ProofMarket", "margin-top:40px; font-size:128px; letter-spacing:-0.03em"); c.append(n); show(n, s.voice + 0.1, { from: "translateY(30px)", dur: 0.9 });
    const tg = el("div", "sub", "Hands, eyes and senses for AI agents.", "margin-top:26px; font-size:46px; color:#fff; font-weight:600"); c.append(tg); show(tg, s.voice + 1.0);
    const tg2 = el("div", "sub", "With proof on Solana.", "margin-top:10px; font-size:40px; color:rgba(255,255,255,.85); font-weight:600"); c.append(tg2); show(tg2, s.voice + 3.2);
    const note = el("div", "small", "Narration: synthesized voice", "left:0; right:0; bottom:40px; text-align:center"); d.append(note); show(note, s.start + 0.8, { from: "none" });
  }
  // 4 — who it is for: agent builders, from any client
  { const s = S[4]; const d = scene("white", s);
    const h = el("div", "h2", "For anyone<br>who builds agents.", "position:absolute; left:140px; top:160px; width:820px"); d.append(h); show(h, s.voice + 0.2);
    const sub = el("div", "sub", "One MCP endpoint. Three ways in.", "position:absolute; left:140px; top:400px; width:800px"); d.append(sub); show(sub, s.voice + 1.6);
    const pills = el("div", "", "", "position:absolute; left:140px; top:500px; width:820px; display:flex; flex-wrap:wrap; gap:16px"); d.append(pills);
    [["claude.ai", 2.6], ["ChatGPT", 3.1], ["Claude Code", 3.6], ["Codex CLI", 4.0], ["Your own code", 4.6]].forEach(([t, at]) => { const p = el("div", "pill", t); pills.append(p); show(p, s.voice + at, { from: "translateY(20px)" }); });
    const ways = el("div", "", "", "position:absolute; left:140px; top:700px; display:flex; gap:16px"); d.append(ways);
    [["MCP", 5.0], ["REST", 5.2], ["x402", 5.4]].forEach(([t, at]) => { const p = el("div", "pill teal-p", t); ways.append(p); show(p, s.voice + at, { from: "translateY(20px)" }); });
    const foot = el("div", "small", "OAuth 2.1 · dynamic client registration · the API key goes to ProofMarket only", "left:140px; top:820px"); d.append(foot); show(foot, s.voice + 5.6, { from: "none" });
    const b = browser(d, A + "dev-clients-col.png", 1040, 110, 760, 820, "transform-origin:0 0");
    show(b, s.voice + 0.8, { from: "translateY(60px)", dur: 1.0 });
    const img = b.querySelector("img"); tween(img, [{ transform: "translateY(0)" }, { transform: "translateY(-50px)" }], s.voice + 2.0, 3.0);
  }
  // 5 — one request, escrowed (real agent card)
  { const s = S[5]; const d = scene("light", s);
    const h = el("div", "h2", "One request.<br>Escrowed on Solana.", "position:absolute; left:140px; top:200px; width:820px"); d.append(h); show(h, s.voice + 0.2);
    const pills = el("div", "", "", "position:absolute; left:140px; top:470px; display:flex; flex-wrap:wrap; gap:16px; width:820px"); d.append(pills);
    [["Task", 0.8], ["Place", 1.5], ["Deadline", 2.1], ["Bounty", 2.7]].forEach(([t, at]) => { const p = el("div", "pill", t); pills.append(p); show(p, s.voice + at, { from: "translateY(20px)" }); });
    const sub = el("div", "sub", "The bounty is locked in the escrow program<br>before anyone starts working.", "position:absolute; left:140px; top:620px; width:800px"); d.append(sub); show(sub, s.voice + 4.2);
    const card = el("div", "card", "", "position:absolute; left:1040px; top:90px; width:720px; height:812px; overflow:hidden; border-radius:30px");
    const img = el("img", "", "", "width:720px; display:block"); img.src = A + "agent-request.png"; card.append(img); d.append(card);
    show(card, s.voice + 0.3, { from: "translateY(60px)", dur: 1.0 });
    tween(img, [{ transform: "translateY(0)" }, { transform: "translateY(-150px)" }], s.voice + 4.0, 2.0);
    const lock = el("div", "pill green-p", "<span class=\"dot\"></span>Escrow funded · 0.30 USDC", "position:absolute; left:1070px; top:830px; font-size:30px"); d.append(lock); show(lock, s.voice + 5.0, { from: "translateY(20px) scale(.95)" });
  }
  // 6 — worker phone
  { const s = S[6]; const d = scene("white", s);
    const h = el("div", "h2", "A person nearby, or at home,<br>takes it on their phone.", "position:absolute; left:140px; top:200px; width:900px"); d.append(h); show(h, s.voice + 0.2);
    const tags = el("div", "", "", "position:absolute; left:140px; top:500px; display:flex; flex-direction:column; gap:20px; align-items:flex-start"); d.append(tags);
    [["New task · 0.30 USDC · 120 m away", 0.6], ["A photo", 3.6], ["A reading", 4.2], ["A phone call", 4.8]].forEach(([t, at]) => { const p = el("div", "pill", t); tags.append(p); show(p, s.voice + at, { from: "translateX(-30px)" }); });
    phone(d, [[A + "phone-04.png", s.start], [A + "phone-06.png", s.voice + 2.4], [A + "phone-10.png", s.voice + 4.0]], 1240, 160);
    const ph = d.querySelector(".phone"); show(ph, s.start + 0.1, { from: "translateY(80px)", dur: 1.0 });
  }
  // 7 — checks + review, then one transaction
  { const s = S[7]; const d = scene("light", s);
    const h = el("div", "h2", "Checked. Then reviewed.", "position:absolute; left:140px; top:120px"); d.append(h); show(h, s.voice + 0.1, { out: s.voice + 5.6 });
    const list = el("div", "", "", "position:absolute; left:140px; top:270px; display:flex; flex-direction:column; gap:26px"); d.append(list);
    [["Taken at the requested place", 0.9], ["Taken just now", 1.4], ["Not a reused photo", 1.9]].forEach(([t, at]) => {
      const c = el("div", "check ok", `<span class="mark">✓</span>${t}`); list.append(c); show(c, s.voice + at, { from: "translateX(-30px)", out: s.voice + 5.6 });
    });
    const rv = el("div", "card", "", "position:absolute; left:140px; top:560px; width:860px; padding:30px 34px; display:flex; flex-direction:column; gap:14px");
    rv.innerHTML = `<div style="font-size:26px; color:#6e6e73; font-weight:600">Claude review</div>
      <div style="font-size:32px; font-weight:600; line-height:1.3">The answer is a summary, but the request asks for the exact text.</div>
      <div class="pill red-p" style="align-self:flex-start; font-size:28px; padding:12px 24px">Sent back · 2 attempts left</div>`;
    d.append(rv); show(rv, s.voice + 3.2, { from: "translateY(40px)", out: s.voice + 5.6 });
    phone(d, [[A + "phone-12.png", s.start], [A + "phone-14.png", s.voice + 3.2], [A + "phone-22.png", s.voice + 5.9]], 1240, 160);
    const ph = d.querySelector(".phone"); show(ph, s.start + 0.1, { from: "translateY(80px)", dur: 1.0 });
    const navy = el("div", "abs", "", "inset:0; background:radial-gradient(1400px 900px at 70% 80%, #16213a 0%, #0b1220 60%, #070b14 100%); opacity:0"); d.insertBefore(navy, ph);
    tween(navy, [{ opacity: 0 }, { opacity: 1 }], s.voice + 5.7, 0.8, "ease-in-out");
    const h2 = el("div", "h2", "One transaction.<br>Recorded and paid.", "position:absolute; left:140px; top:120px; width:900px; color:#f5f5f7"); d.append(h2); show(h2, s.voice + 6.1);
    const tx = el("div", "", "", "position:absolute; left:140px; top:400px; width:820px; padding:10px 0; color:#f5f5f7"); d.append(tx);
    [["Program", "ProofMarket escrow · Solana"], ["Result hash", "<span class=tx>92d4 dfa8 … 5f7c</span>"], ["Evidence root", "<span class=tx>b32f 9bd6 … 236c</span>"], ["Payout", "0.30 USDC → worker"], ["Witnesses", "1 of 1 agreed"]].forEach(([k, v], i) => {
