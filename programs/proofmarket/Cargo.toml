[package]
name = "proofmarket"
version = "0.1.0"
description = "ProofMarket escrow + attestation program (specs/proofmarket/implementation/en/06-solana-program-design.md)"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "proofmarket"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
# allow-missing-optionals: initialize_task's trailing optional `allowed_mint` may be left out, so the server
# that predates v1.2 keeps working against the upgraded program (15 §3.1).
anchor-lang = { version = "1.2.0", features = ["allow-missing-optionals"] }
anchor-spl = { version = "1.2.0", default-features = false, features = ["token", "token_2022", "associated_token"] }

[dev-dependencies]
# 0.14+ (Agave 4.1 runtime) is needed to load the SBPF v3 binary that `anchor build` 1.2 produces by default;
# 0.10 (Agave 3.1) rejects it with InvalidAccountData.
litesvm = "0.17.0"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
solana-account = "4.3.0"
solana-transaction-error = "3.3.1"
base64 = "0.22.1"
# 16 §5: builds Token-2022 mints and accounts with extensions in the tests (same version as the lock file).
spl-pod = "0.7.4"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
